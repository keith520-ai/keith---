<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思考碎片 · 万朗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/styles.css">
    <style>.thought-chip{transition:all .2s ease}.thought-chip:hover{transform:translateY(-2px)}</style>
</head>
<body class="bg-white">

    <section class="min-h-screen w-full px-6 md:px-10 py-20 bg-gradient-to-b from-gray-50 to-white">
        <div class="max-w-5xl mx-auto card-fade">
            <div class="mb-16 mt-8">
                <div class="flex items-center gap-3 mb-4"><span class="page-header-num text-xs text-gray-300">06</span><div class="w-8 h-0.5 bg-gradient-to-r from-[#60A5FA] to-[#3B82F6]"></div></div>
                <h1 class="text-5xl font-bold text-gray-900 mb-4" style="font-family:'Playfair Display',Georgia,serif;">思考碎片</h1>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="thought-chip bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"><p class="text-xs text-blue-400 font-mono mb-2">2026.06.25</p><p class="text-gray-700 leading-relaxed">好产品不是给用户更多选择，而是帮用户减少决策负担。</p></div>
                <div class="thought-chip bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"><p class="text-xs text-pink-400 font-mono mb-2">2026.06.20</p><p class="text-gray-700 leading-relaxed">AI 不会取代产品经理，但会取代不会用 AI 的产品经理。</p></div>
                <div class="thought-chip bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"><p class="text-xs text-amber-400 font-mono mb-2">2026.06.15</p><p class="text-gray-700 leading-relaxed">用户说的需求，往往是他们能想到的最差解决方案。</p></div>
                <div class="thought-chip bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"><p class="text-xs text-emerald-400 font-mono mb-2">2026.06.10</p><p class="text-gray-700 leading-relaxed">社交产品的本质不是连接人，而是连接人在彼此身上的投射。</p></div>
                <div class="thought-chip bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"><p class="text-xs text-violet-400 font-mono mb-2">2026.06.05</p><p class="text-gray-700 leading-relaxed">设计的最高境界，是让技术隐于无形，让体验自然流淌。</p></div>
            </div>
        </div>
    </section>

    <script src="/shared/nav.js?v=5"></script>
</body>
</html>
