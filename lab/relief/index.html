<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 解忧小工具 · 实验场</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="relief.css">
</head>
<body class="relief-body">

    <!-- 顶部返回 & 全局设置栏 -->
    <header class="relief-topbar">
        <a href="/lab/" class="topbar-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            <span>实验场</span>
        </a>
        <div class="topbar-title">AI 解忧小工具</div>
        <div class="topbar-actions">
            <button id="vibrate-toggle" class="icon-btn" title="震动开关" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 8v8m3-11v14m3-10v6m3-8v10m3-6v2"/></svg>
            </button>
            <button id="progress-badge" class="progress-badge" title="解压值">
                <span class="dot"></span>
                <span id="progress-value">0</span>
            </button>
        </div>
    </header>

    <!-- 模块切换器 -->
    <nav class="module-tabs">
        <button class="tab-btn active" data-target="mod-ear">
            <span class="tab-icon">👂</span>
            <span class="tab-label">掏耳朵</span>
        </button>
        <button class="tab-btn" data-target="mod-bottle">
            <span class="tab-icon">🍾</span>
            <span class="tab-label">漂流瓶</span>
        </button>
        <button class="tab-btn" data-target="mod-void">
            <span class="tab-icon">🌌</span>
            <span class="tab-label">放空专区</span>
        </button>
    </nav>

    <!-- ================== 模块1：掏耳朵 ================== -->
    <section id="mod-ear" class="module module-active">
        <div class="ear-progress-wrap">
            <div class="ear-progress-bar"><div id="ear-progress-fill"></div></div>
            <div class="ear-progress-text"><span id="ear-progress-text">0%</span></div>
        </div>

        <div class="ear-stage">
            <canvas id="ear-canvas" width="480" height="480"></canvas>
            <div id="ear-glow" class="ear-glow hidden"></div>
            <div id="ear-tip" class="ear-tip hidden">心里乱糟糟的小事都清理干净啦</div>
        </div>

        <div class="ear-toolbar">
            <button class="tool-btn active" data-tool="swab">
                <div class="tool-emoji">🌱</div>
                <div class="tool-name">棉签</div>
            </button>
            <button class="tool-btn" data-tool="scoop">
                <div class="tool-emoji">🥄</div>
                <div class="tool-name">耳勺</div>
            </button>
            <button class="tool-btn" data-tool="brush">
                <div class="tool-emoji">🪶</div>
                <div class="tool-name">软毛刷</div>
            </button>
            <button class="tool-btn reset" id="ear-reset">
                <div class="tool-emoji">🔄</div>
                <div class="tool-name">重置烦恼</div>
            </button>
        </div>
    </section>

    <!-- ================== 模块2：漂流瓶 ================== -->
    <section id="mod-bottle" class="module">
        <div class="sea-stage">
            <div class="sea-sky"></div>
            <div class="sea-waves">
                <div class="wave wave-1"></div>
                <div class="wave wave-2"></div>
                <div class="wave wave-3"></div>
            </div>
            <div id="bottle-field" class="bottle-field"></div>
        </div>

        <div class="sea-footer">
            <button class="ghost-btn" id="open-fav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 010-6.364z"/></svg>
                <span>我的信纸 <span id="fav-count">0</span></span>
            </button>
            <div class="sea-hint">点击海面上的漂流瓶，打开一封温柔的信</div>
        </div>

        <!-- 信纸弹层 -->
        <div id="letter-overlay" class="letter-overlay hidden">
            <div class="bottle-anim" id="bottle-anim"></div>
            <div class="letter" id="letter-card">
                <div class="letter-decor">✧</div>
                <div class="letter-text" id="letter-text">—</div>
                <div class="letter-sign">— 来自海的另一端</div>
                <div class="letter-actions">
                    <button class="ghost-btn" id="btn-fav-letter">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 010-6.364z"/></svg>
                        <span>收藏信纸</span>
                    </button>
                    <button class="ghost-btn primary" id="btn-release">放回大海</button>
                </div>
            </div>
        </div>

        <!-- 收藏面板 -->
        <div id="fav-panel" class="fav-panel hidden">
            <div class="fav-header">
                <div class="fav-title">我的信纸收藏</div>
                <button class="icon-btn" id="fav-close" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="fav-list" id="fav-list"></div>
        </div>
    </section>

    <!-- ================== 模块3：放空专区 ================== -->
    <section id="mod-void" class="module">
        <div class="void-stage" id="void-stage">
            <!-- 场景1: 星云呼吸 -->
            <div class="scene scene-nebula active" data-scene="nebula">
                <div class="breath-orb"></div>
                <div class="star-particles"></div>
            </div>
            <!-- 场景2: 潮汐沙滩 -->
            <div class="scene scene-beach" data-scene="beach">
                <div class="beach-sky"></div>
                <div class="beach-sand"></div>
                <div class="beach-wave"></div>
                <div class="beach-worry" id="beach-worry"></div>
            </div>
            <!-- 场景3: 林间萤火 -->
            <div class="scene scene-forest" data-scene="forest">
                <div class="forest-bg"></div>
                <div class="grass-layer"></div>
                <div class="firefly-layer"></div>
            </div>

            <!-- 呼吸引导 -->
            <div id="breath-guide" class="breath-guide hidden">
                <div class="breath-text" id="breath-text">吸 气</div>
                <div class="breath-ring"></div>
                <button class="ghost-btn small" id="breath-stop">结束引导</button>
            </div>

            <div class="void-hint">
                <span class="hint-line">单击切换场景</span>
                <span class="hint-line">长按 3 秒开启呼吸引导</span>
            </div>
        </div>

        <!-- 白噪音控制面板 -->
        <div class="noise-panel">
            <div class="noise-list" id="noise-list">
                <button class="noise-btn" data-noise="rain">🌧<span>细雨</span></button>
                <button class="noise-btn" data-noise="fire">🔥<span>柴火</span></button>
                <button class="noise-btn" data-noise="wind">🍃<span>微风</span></button>
                <button class="noise-btn" data-noise="stream">🏞<span>溪流</span></button>
                <button class="noise-btn" data-noise="white">〰<span>白噪音</span></button>
                <button class="noise-btn" data-noise="bug">🦗<span>虫鸣</span></button>
            </div>
            <div class="noise-controls">
                <div class="control-row">
                    <label>音量</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="60">
                </div>
                <div class="control-row">
                    <label>定时</label>
                    <div class="timer-group">
                        <button class="timer-btn" data-min="10">10 分</button>
                        <button class="timer-btn" data-min="30">30 分</button>
                        <button class="timer-btn" data-min="60">60 分</button>
                        <button class="timer-btn off active" data-min="0">关闭</button>
                    </div>
                </div>
                <div class="control-row">
                    <label>护眼模式</label>
                    <button class="switch" id="eye-care-toggle" aria-pressed="false"><span></span></button>
                </div>
            </div>
        </div>
    </section>

    <!-- 合规提示 -->
    <footer class="compliance">
        本工具仅作情绪舒缓，无法替代专业心理咨询。长期情绪低落，请寻求线下专业帮助。
    </footer>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="relief.js"></script>
</body>
</html>
