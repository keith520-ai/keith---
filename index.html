<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万朗 · Product Manager</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #87a7c7; }
  canvas { display: block; }

  /* ===== 加载界面 ===== */
  #loading {
    position: fixed; inset: 0; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.8s; color: #fff; gap: 20px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner {
    width: 52px; height: 52px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .label { font-size: 15px; opacity: 0.6; letter-spacing: 1px; text-align: center; }
  #loading .progress-bar {
    width: 240px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
  }
  #loading .progress-fill {
    height: 100%; width: 0%; background: #fff; border-radius: 2px; transition: width 0.3s;
  }

  /* ===== 顶部导航（6大模块 + Logo）===== */
  #navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 36px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
  }
  #navbar .logo {
    color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.6); pointer-events: auto;
    text-decoration: none;
  }
  #navbar .logo span { opacity: 0.5; font-weight: 300; }
  #navbar nav { display: flex; gap: 28px; pointer-events: auto; }
  #navbar nav a {
    color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px;
    font-weight: 500; letter-spacing: 1px; transition: color 0.2s;
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  }
  #navbar nav a:hover { color: #fff; }

  /* ===== 个人介绍卡 ===== */
  #intro-card {
    position: fixed; left: 36px; top: 50%; transform: translateY(-50%);
    z-index: 15; max-width: 380px; pointer-events: none;
    opacity: 0; animation: fadeInLeft 1.2s 0.8s forwards;
  }
  @keyframes fadeInLeft {
    from { opacity: 0; transform: translate(-20px, -50%); }
    to { opacity: 1; transform: translate(0, -50%); }
  }
  #intro-card h1 {
    color: #fff; font-size: 42px; font-weight: 800; line-height: 1.1;
    margin-bottom: 18px; text-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  #intro-card p {
    color: rgba(255,255,255,0.85); font-size: 15px; line-height: 1.8;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

</style>
</head>
<body>

  <!-- 加载界面 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="label" id="loading-label">正在加载场景...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <!-- 顶部导航：6大模块 -->
  <nav id="navbar">
    <a href="/" class="logo">万朗<span> · Product Manager</span></a>
    <nav>
      <a href="/" title="首页" class="home-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v11h14V10"/><path d="M9 21V13h6v8"/></svg></a>
      <a href="/story/">个人故事</a>
      <a href="/projects/">项目经历</a>
      <a href="/inspiration/">灵感采集</a>
      <a href="/lab/">实验场</a>
      <a href="/fun/">趣味互动</a>
      <a href="/thoughts/">思考碎片</a>
    </nav>
  </nav>

  <!-- 介绍卡 -->
  <div id="intro-card">
    <h1>你好，<br>我是万朗</h1>
    <p>AI × Social 产品经理<br>用设计思维解决真实问题</p>
  </div>

  <canvas id="canvas"></canvas>

  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "/assets/js/three.module.js",
      "three/addons/": "/assets/js/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  window.addEventListener('error', (ev) => {
    let box = document.getElementById('err-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'err-box';
      box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:999;max-width:60vw;'
        + 'background:rgba(180,0,0,.9);color:#fff;font:12px/1.5 monospace;padding:10px 14px;'
        + 'border-radius:8px;white-space:pre-wrap;pointer-events:none;';
      document.body.appendChild(box);
    }
    box.textContent = 'JS ERROR: ' + (ev.message || ev.error) + (ev.filename ? ('\n@ ' + ev.filename + ':' + ev.lineno) : '');
  });

  let scene, camera, renderer, controls;
  let character, mixer, actions = {};
  let town;
  let currentAction = null, currentActionName = '';
  let clock = new THREE.Clock();

  const CHARACTER_FEET_LOCAL_Y = -0.0246;
  const GROUND_Y = 0.045;
  const STAND_X = 0.03;
  const STAND_Z = 0.1;
  const CHARACTER_SCALE = 0.175;
  const CHARACTER_Y_OFFSET = 0.006;

  const FX = {
    INTRO_DURATION: 3.0,
    INTRO_BLUR: 4,
    CLOUD_COUNT: 12,
    CLOUD_OPACITY: 0.92,
    CLOUD_SPREAD: 0.6,
    CLOUD_BOB_SPEED: 0.5,
    CLOUD_BOB_AMP: 0.03,
    ISLAND_START_ANGLE: 0.30,
    GREETING_ANIM: '挥手_1',
    IDLE_ANIM: 'Idle_4',
    KICK_ANIM: 'Kick To The Groin_6',
    CLICK_TORSO_MIN_Y: 0.25,
    CLICK_TORSO_MAX_Y: 1.05,
  };

  const CAM_TARGET = new THREE.Vector3(STAND_X, GROUND_Y + 0.16, STAND_Z);
  const CAM_FINAL  = new THREE.Vector3(STAND_X - 0.02, GROUND_Y + 0.22, STAND_Z + 0.837);
  const CAM_START  = new THREE.Vector3(STAND_X + 0.95, GROUND_Y + 0.62, STAND_Z - 1.35);

  let camStartPos = new THREE.Vector3();
  let camFinalPos = new THREE.Vector3();
  let introDone = false;
  let pendingOnceCallback = null;
  let cloudLayer = null;
  let cloudTime = 0;
  let introTl = null;

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let pointerDown = null;

  async function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a7c7);

    camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100);
    camStartPos = CAM_START.clone();
    camFinalPos = CAM_FINAL.clone();
    camera.position.copy(camStartPos);
    scene.add(camera);

    renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(CAM_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.5;
    controls.minPolarAngle = Math.PI * 0.15;
    controls.minDistance = 0.4;
    controls.maxDistance = 1.0;
    controls.enablePan = false;
    controls.rotateSpeed = 0.6;
    controls.minAzimuthAngle = -Math.PI / 2;
    controls.maxAzimuthAngle = Math.PI / 2;
    controls.enabled = true;
    controls.enableZoom = true;
    controls.autoRotate = false;

    scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x8a7d5a, 1.0));
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const sunLight = new THREE.DirectionalLight(0xfff3e0, 2.0);
    sunLight.position.set(STAND_X + 0.6, GROUND_Y + 1.5, STAND_Z + 0.6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 0.05;
    sunLight.shadow.camera.far = 5;
    sunLight.shadow.camera.left = -1.0;
    sunLight.shadow.camera.right = 1.0;
    sunLight.shadow.camera.top = 1.0;
    sunLight.shadow.camera.bottom = -1.0;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
    fillLight.position.set(STAND_X - 0.6, GROUND_Y + 0.8, STAND_Z - 0.6);
    scene.add(fillLight);

    cloudLayer = createFrontClouds();

    const shadowGround = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    shadowGround.rotation.x = -Math.PI / 2;
    shadowGround.position.set(STAND_X, GROUND_Y, STAND_Z);
    shadowGround.receiveShadow = true;
    scene.add(shadowGround);

    await loadTown();
    await loadCharacter();

    addEventListener('resize', onResize);
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointerup', onPointerUp);

    document.getElementById('loading').classList.add('hidden');
    startIntro();
    animate();
  }

  function loadTown() {
    return new Promise((resolve, reject) => {
      const loader = new GLTFLoader();
      loader.load('/assets/flat_ground.glb', (gltf) => {
        town = gltf.scene;
        let meshCount = 0;
        town.traverse(o => {
          if (o.isMesh) {
            meshCount++;
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.material) {
              if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
              if (o.material.metalness !== undefined) o.material.envMapIntensity = 0.3;
            }
          }
        });
        scene.add(town);
        resolve();
      }, (progress) => {
        if (progress.lengthComputable) {
          const pct = Math.round(progress.loaded / progress.total * 100);
          document.getElementById('loading-label').textContent = `正在加载小岛场景... ${pct}%`;
          document.getElementById('progress-fill').style.width = pct + '%';
        }
      }, (error) => {
        document.getElementById('loading-label').textContent = '小岛加载失败';
        reject(error);
      });
    });
  }

  function createFrontClouds() {
    const layer = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 1, metalness: 0,
      transparent: true, opacity: FX.CLOUD_OPACITY,
      depthWrite: false,
      emissive: 0x46586a, emissiveIntensity: 0.12
    });
    const COUNT = FX.CLOUD_COUNT;
    const cols = 4, rows = 3;
    for (let i = 0; i < COUNT; i++) {
      const puff = new THREE.Group();
      const blobs = 3 + Math.floor(Math.random() * 4);
      for (let j = 0; j < blobs; j++) {
        const r = 0.10 + Math.random() * 0.12;
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 2), mat);
        m.position.set((Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.18, (Math.random() - 0.5) * 0.22);
        puff.add(m);
      }
      const gx = i % cols, gy = Math.floor(i / cols);
      const x = (gx / (cols - 1) - 0.5) * 1.1;
      const y = (gy / (rows - 1) - 0.5) * 0.8;
      const z = -0.45 - Math.random() * 0.35;
      puff.position.set(x, y, z);
      puff.scale.setScalar(0.8 + Math.random() * 0.6);
      const dir = new THREE.Vector3(x, y, 0).normalize();
      puff.userData = {
        base: puff.position.clone(), spread: dir,
        bobPhase: Math.random() * Math.PI * 2,
        bobSpeed: FX.CLOUD_BOB_SPEED * (0.7 + Math.random() * 0.6),
        bobAmp: FX.CLOUD_BOB_AMP * (0.6 + Math.random() * 0.8)
      };
      layer.add(puff);
    }
    layer.userData.mat = mat;
    layer.userData.reveal = 0;
    camera.add(layer);
    return layer;
  }

  function updateCloudReveal(e) {
    if (!cloudLayer) return;
    cloudLayer.userData.reveal = e;
    cloudLayer.userData.mat.opacity = (1 - e) * FX.CLOUD_OPACITY;
  }

  function destroyClouds() {
    if (!cloudLayer) return;
    cloudLayer.traverse(o => {
      if (o.isMesh) {
        o.geometry.dispose();
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    camera.remove(cloudLayer);
    cloudLayer = null;
  }

  function loadCharacter() {
    return new Promise((resolve, reject) => {
      const loader = new GLTFLoader();
      loader.load('/assets/character-perfect.glb', (gltf) => {
        character = gltf.scene;
        character.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.geometry) {
              o.geometry.computeBoundingSphere();
              if (o.geometry.boundingSphere) o.geometry.boundingSphere.radius *= 3;
            }
            if (o.material && o.material.map) {
              o.material.map.colorSpace = THREE.SRGBColorSpace;
            }
          }
        });

        character.scale.setScalar(CHARACTER_SCALE);
        character.position.set(STAND_X, GROUND_Y - CHARACTER_FEET_LOCAL_Y * CHARACTER_SCALE + CHARACTER_Y_OFFSET, STAND_Z);
        scene.add(character);

        mixer = new THREE.AnimationMixer(character);

        gltf.animations.forEach(clip => {
          const action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopRepeat, Infinity);
          actions[clip.name] = action;
        });

        mixer.addEventListener('finished', () => {
          if (pendingOnceCallback) {
            const cb = pendingOnceCallback; pendingOnceCallback = null;
            cb();
          }
        });

        playLoop(FX.IDLE_ANIM, 0.0);
        resolve();
      }, (progress) => {
        if (progress.lengthComputable) {
          const pct = Math.round(progress.loaded / progress.total * 100);
          document.getElementById('loading-label').textContent = `正在加载3D角色... ${pct}%`;
          document.getElementById('progress-fill').style.width = pct + '%';
        }
      }, (error) => {
        document.getElementById('loading-label').textContent = '人物加载失败';
        reject(error);
      });
    });
  }

  function ensureLoop(name) {
    const a = actions[name];
    if (a) { a.setLoop(THREE.LoopRepeat, Infinity); a.clampWhenFinished = false; a.enabled = true; }
    return a;
  }
  function ensureOnce(name) {
    const a = actions[name];
    if (a) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; a.enabled = true; }
    return a;
  }
  function playLoop(name, fade = 0.3) {
    if (!actions[name] || currentActionName === name) return;
    const next = ensureLoop(name);
    if (currentAction) currentAction.fadeOut(fade);
    next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(fade).play();
    currentAction = next;
    currentActionName = name;
  }
  function playOnce(name, fade = 0.3, onDone = null) {
    if (!actions[name]) return;
    const next = ensureOnce(name);
    if (currentAction) currentAction.fadeOut(fade);
    next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(fade).play();
    currentAction = next;
    currentActionName = name;
    pendingOnceCallback = onDone || null;
  }

  function startIntro() {
    camera.position.copy(camStartPos);
    camera.lookAt(CAM_TARGET);
    controls.enabled = false;
    if (town) town.rotation.y = FX.ISLAND_START_ANGLE;

    const state = { p: 0 };
    introTl = gsap.timeline();
    introTl.to(state, {
      p: 1, duration: FX.INTRO_DURATION, ease: 'power2.inOut',
      onUpdate: () => {
        const e = state.p;
        camera.position.lerpVectors(camStartPos, camFinalPos, e);
        camera.lookAt(CAM_TARGET);
        if (town) town.rotation.y = FX.ISLAND_START_ANGLE * (1 - e);
        updateCloudReveal(e);
        const blur = (1 - e) * FX.INTRO_BLUR;
        renderer.domElement.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
      }
    }, 0);
  }

  function finalizeIntro() {
    if (introDone) return;
    introDone = true;
    camera.position.copy(camFinalPos);
    camera.lookAt(CAM_TARGET);
    if (town) town.rotation.y = 0;
    controls.enabled = true;
    renderer.domElement.style.filter = 'none';
    destroyClouds();
    playOnce(FX.GREETING_ANIM, 0.3, () => {
      playLoop(FX.IDLE_ANIM, 0.4);
    });
  }

  function onPointerDown(e) { if (introDone) pointerDown = { x: e.clientX, y: e.clientY }; }
  function onPointerUp(e) {
    if (!introDone || !pointerDown) return;
    const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    pointerDown = null;
    if (Math.hypot(dx, dy) > 10) return;
    handleCharacterClick(e.clientX, e.clientY);
  }
  function handleCharacterClick(cx, cy) {
    if (!character) return;
    pointer.x = (cx / innerWidth) * 2 - 1;
    pointer.y = -(cy / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    character.updateMatrixWorld(true);
    const hits = raycaster.intersectObject(character, true);
    if (!hits.length) return;
    const hit = hits[0];
    const local = character.worldToLocal(hit.point.clone());
    const ly = local.y;
    const inRange = ly > FX.CLICK_TORSO_MIN_Y && ly < FX.CLICK_TORSO_MAX_Y;
    if (inRange) triggerKick();
  }
  function triggerKick() {
    playOnce(FX.KICK_ANIM, 0.25, () => playLoop(FX.IDLE_ANIM, 0.3));
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    if (cloudLayer) {
      cloudTime += dt;
      const reveal = cloudLayer.userData.reveal || 0;
      const sp = FX.CLOUD_SPREAD * reveal;
      cloudLayer.children.forEach(puff => {
        const u = puff.userData;
        puff.position.x = u.base.x + u.spread.x * sp;
        puff.position.y = u.base.y + u.spread.y * sp + Math.sin(cloudTime * u.bobSpeed + u.bobPhase) * u.bobAmp;
        puff.position.z = u.base.z - reveal * 0.2;
      });
    }

    if (mixer) mixer.update(dt);

    if (!introDone && introTl && introTl.progress() >= 1) finalizeIntro();

    if (introDone) controls.update();
    renderer.render(scene, camera);

  }

  init();
  </script>
</body>
</html>
