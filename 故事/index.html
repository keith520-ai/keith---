<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人故事 · 万朗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/shared/styles.css">
</head>
<body class="bg-white">

    <section class="min-h-screen w-full px-8 py-20 bg-white">
        <div class="max-w-5xl mx-auto card-fade">
            <a href="/" class="back-link mb-12">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>返回首页</span>
            </a>

            <div class="mb-16 mt-8">
                <div class="flex items-center gap-3 mb-4">
                    <span class="page-header-num text-xs text-gray-300">01</span>
                    <div class="w-8 h-0.5 bg-gradient-to-r from-[#FF6B6B] to-[#FF8E72]"></div>
                </div>
                <h1 class="text-5xl font-bold text-gray-900 mb-4">个人故事</h1>
                <p class="text-gray-400 text-lg">My Story — 从好奇到热爱</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-12 mb-16">
                <div class="md:col-span-2 space-y-6">
                    <div class="bg-gradient-to-br from-red-50 to-orange-50 rounded-2xl p-8 border border-red-100">
                        <p class="text-gray-700 leading-relaxed text-lg">
                            我从小就对人的行为充满好奇。小时候喜欢观察朋友们做选择时的微妙反应，长大后这种好奇变成了对用户心理的系统性思考。
                        </p>
                    </div>
                    <div class="bg-white border border-gray-100 rounded-2xl p-8">
                        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-4">我的旅程</h3>
                        <div class="space-y-4">
                            <div class="flex gap-4">
                                <div class="w-2 h-2 rounded-full bg-[#FF6B6B] mt-2 flex-shrink-0"></div>
                                <p class="text-gray-600 leading-relaxed">大学时期开始接触产品设计和用户研究，发现自己擅长从混沌中理出清晰的逻辑</p>
                            </div>
                            <div class="flex gap-4">
                                <div class="w-2 h-2 rounded-full bg-[#FF8E72] mt-2 flex-shrink-0"></div>
                                <p class="text-gray-600 leading-relaxed">实习中深入参与产品从0到1的过程，学会了如何在用户需求和商业目标之间找到平衡</p>
                            </div>
                            <div class="flex gap-4">
                                <div class="w-2 h-2 rounded-full bg-[#FFB347] mt-2 flex-shrink-0"></div>
                                <p class="text-gray-600 leading-relaxed">现在专注于AI应用和社交产品方向，相信技术可以让每个人的创造力被放大</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-gradient-to-br from-red-50 to-orange-50 rounded-xl p-6 border border-red-100">
                        <p class="text-4xl font-bold text-[#FF6B6B] mb-2">5+</p>
                        <p class="text-gray-600 text-sm">实习项目经历</p>
                    </div>
                    <div class="bg-gradient-to-br from-cyan-50 to-teal-50 rounded-xl p-6 border border-cyan-100">
                        <p class="text-4xl font-bold text-[#4ECDC4] mb-2">100%</p>
                        <p class="text-gray-600 text-sm">用户导向思维</p>
                    </div>
                    <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 border border-purple-100">
                        <p class="text-4xl font-bold text-[#A78BFA] mb-2">∞</p>
                        <p class="text-gray-600 text-sm">对世界的好奇心</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-6">兴趣领域</h3>
                <div class="flex flex-wrap gap-3">
                    <span class="bg-gradient-to-r from-red-100 to-orange-100 text-red-700 px-6 py-3 rounded-full text-sm font-medium">社交产品</span>
                    <span class="bg-gradient-to-r from-cyan-100 to-teal-100 text-cyan-700 px-6 py-3 rounded-full text-sm font-medium">内容平台</span>
                    <span class="bg-gradient-to-r from-orange-100 to-yellow-100 text-orange-700 px-6 py-3 rounded-full text-sm font-medium">AI应用</span>
                    <span class="bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 px-6 py-3 rounded-full text-sm font-medium">消费品</span>
                    <span class="bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-700 px-6 py-3 rounded-full text-sm font-medium">数据产品</span>
                </div>
            </div>
        </div>
    </section>

    <script src="/shared/nav.js"></script>
</body>
</html>
